<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastrar paciente · Sistema Hospitalar</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <aside class="menu">
      <a class="marca" href="../painel/index.html"
        ><span class="marca-icone"
          ><img src="../../assets/icons/estetoscopio.svg" alt=""
        /></span>
        Sistema Hospitalar</a
      >
      <nav aria-label="Menu principal">
        <ul>
          <li><a href="../painel/index.html">Painel</a></li>
        </ul>
        <div class="grupo">
          <input
            class="grupo-toggle"
            type="checkbox"
            id="grupo-cadastros"
            checked
          />
          <label class="grupo-titulo" for="grupo-cadastros">Cadastros</label>
          <ul>
            <li><a href="index.html" aria-current="page">Pacientes</a></li>
            <li><a href="../profissionais/index.html">Profissionais</a></li>
            <li><a href="../quartos/index.html">Quartos</a></li>
            <li><a href="../atendimentos/index.html">Atendimentos</a></li>
          </ul>
        </div>
        <div class="grupo">
          <input class="grupo-toggle" type="checkbox" id="grupo-agenda" />
          <label class="grupo-titulo" for="grupo-agenda">Agenda</label>
          <ul>
            <li><a href="../agenda/index.html">Agenda do profissional</a></li>
          </ul>
        </div>
      </nav>
      <div class="sair"><a href="../../index.html">Sair</a></div>
    </aside>

    <main>
      <div class="cabecalho">
        <div>
          <a class="voltar" href="index.html"
            ><img src="../../assets/icons/seta-voltar.svg" alt="" />
            Pacientes</a
          >
          <h1>Cadastrar paciente</h1>
          <p class="subtitulo">
            O histórico do paciente é criado automaticamente.
          </p>
        </div>
      </div>

      <form class="painel">
        <div class="campos">
          <div class="campo inteiro">
            <label for="nome">Nome completo</label
            ><input id="nome" type="text" placeholder="Ex.: Maria da Silva" />
          </div>
          <div class="campo">
            <label for="cpf">CPF</label
            ><input id="cpf" type="text" placeholder="000.000.000-00" />
          </div>
          <div class="campo">
            <label for="nasc">Data de nascimento</label
            ><input id="nasc" type="date" />
          </div>
          <div class="campo">
            <label for="tel">Telefone</label
            ><input id="tel" type="tel" placeholder="(31) 90000-0000" />
          </div>
          <div class="campo">
            <label for="email">E-mail</label
            ><input id="email" type="email" placeholder="nome@email.com" />
          </div>
          <div class="campo inteiro">
            <label for="endereco">Endereço</label
            ><input
              id="endereco"
              type="text"
              placeholder="Rua, número, bairro, cidade"
            />
          </div>
        </div>
        <div class="acoes">
          <a href="index.html" class="botao secundario">Cancelar</a>
          <button type="button" class="botao">Salvar paciente</button>
        </div>
      </form>
    </main>
  </body>
</html>
