<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastrar quarto · Sistema Hospitalar</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <aside class="menu">
      <a class="marca" href="../painel/index.html"
        ><span class="marca-icone"
          ><img src="../../assets/icons/estetoscopio.svg" alt=""
        /></span>
        Sistema Hospitalar</a
      >
      <nav aria-label="Menu principal">
        <ul>
          <li><a href="../painel/index.html">Painel</a></li>
        </ul>
        <div class="grupo">
          <input
            class="grupo-toggle"
            type="checkbox"
            id="grupo-cadastros"
            checked
          />
          <label class="grupo-titulo" for="grupo-cadastros">Cadastros</label>
          <ul>
            <li><a href="../pacientes/index.html">Pacientes</a></li>
            <li><a href="../profissionais/index.html">Profissionais</a></li>
            <li><a href="index.html" aria-current="page">Quartos</a></li>
            <li><a href="../atendimentos/index.html">Atendimentos</a></li>
          </ul>
        </div>
        <div class="grupo">
          <input class="grupo-toggle" type="checkbox" id="grupo-agenda" />
          <label class="grupo-titulo" for="grupo-agenda">Agenda</label>
          <ul>
            <li><a href="../agenda/index.html">Agenda do profissional</a></li>
          </ul>
        </div>
      </nav>
      <div class="sair"><a href="../../index.html">Sair</a></div>
    </aside>

    <main>
      <div class="cabecalho">
        <div>
          <a class="voltar" href="index.html"
            ><img src="../../assets/icons/seta-voltar.svg" alt="" /> Quartos</a
          >
          <h1>Cadastrar quarto</h1>
          <p class="subtitulo">
            Informe a identificação, o andar e quantos pacientes o quarto
            comporta.
          </p>
        </div>
      </div>

      <form class="painel">
        <div class="campos">
          <div class="campo">
            <label for="num">Número de identificação</label
            ><input id="num" type="number" min="1" placeholder="Ex.: 104" />
          </div>
          <div class="campo">
            <label for="andar">Andar</label
            ><input id="andar" type="number" min="0" placeholder="Ex.: 1" />
          </div>
          <div class="campo">
            <label for="cap">Capacidade máxima</label
            ><input
              id="cap"
              type="number"
              min="1"
              placeholder="Nº de pacientes"
            />
          </div>
          <div class="campo">
            <label for="sit">Situação</label>
            <select id="sit">
              <option>Disponível</option>
              <option>Ocupado</option>
            </select>
          </div>
        </div>
        <div class="acoes">
          <a href="index.html" class="botao secundario">Cancelar</a>
          <button type="button" class="botao">Salvar quarto</button>
        </div>
      </form>
    </main>
  </body>
</html>
